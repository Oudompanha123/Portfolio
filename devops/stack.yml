version: "3.8"

services:
  portfolio:
    image: portfolio:${IMAGE_TAG:-latest}
    ports:
      - "3100:3000"
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is not set - see devops/README.md#6-contact-form}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback
